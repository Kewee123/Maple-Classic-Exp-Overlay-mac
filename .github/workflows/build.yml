# Builds and releases the Apple Silicon Mac download on GitHub.
#
# A new VERSION pushed to main builds the Mac app, tags it v<VERSION>, and publishes
# its GitHub release, with the notes from that version's CHANGELOG.md section. Pushing
# a version tag does the same. Run workflow with "release" ticked publishes the current
# version from main without bumping it. Without a new version, the zip is kept as an
# Actions artifact only.
name: Build

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish this version now: tag v + VERSION in maple_exp.py and release it. From main only."
        type: boolean
        default: false
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "maple_exp.py"
      - "CHANGELOG.md"

permissions:
  contents: read

# One build at a time, so two runs can't race to make the same tag or release.
concurrency:
  group: build-release
  cancel-in-progress: false

jobs:
  mac:
    runs-on: macos-14
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
          fetch-depth: 0                 # to compare VERSION with the commit before this push

      - name: Identify the release
        id: tag
        shell: bash
        env:
          RELEASE: ${{ inputs.release }}
          BEFORE: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"/\1/p' maple_exp.py)
          tag="v$version"
          release=false

          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "::error::The tag is $GITHUB_REF_NAME but maple_exp.py says VERSION = $version."
              exit 1
            fi
            release=true
            tag="$GITHUB_REF_NAME"
          elif [ "$RELEASE" = "true" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Releases are only made from main."
              exit 1
            fi
            release=true
          elif [ "$GITHUB_REF" == "refs/heads/main" ]; then
            # A push to main: publish only a version that isn't tagged yet, and only when
            # this push changed VERSION. An ordinary code push just builds.
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" >/dev/null 2>&1; then
              echo "$tag is already tagged: building without releasing."
            else
              old=""
              if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                old=$(git show "$BEFORE:maple_exp.py" | sed -n 's/^VERSION = "\(.*\)"/\1/p')
              fi
              if [ "$old" != "$version" ]; then
                release=true
              else
                echo "VERSION is still $version (unchanged in this push): building without releasing."
              fi
            fi
          fi

          if [ "$release" = "true" ]; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install the packages
        run: python -m pip install --require-hashes -r requirements-build-mac.txt

      - name: Install build tools
        run: brew install tesseract dylibbundler ninja

      - name: Tests
        run: |
          python tests/test_logic.py
          python tests/test_screen.py
          python tests/test_ocr.py
          python tests/test_report.py
          python tests/test_update.py

      - name: Build Tesseract for macOS 14.0
        shell: bash
        run: |
          src="$RUNNER_TEMP/tesseract-src"
          out="$RUNNER_TEMP/tesseract"
          git clone --quiet --depth 1 --branch 5.5.3 https://github.com/tesseract-ocr/tesseract "$src"
          commit=$(git -C "$src" rev-parse HEAD)
          if [ "$commit" != "db0ec62f81b0737fbbe184d8fea40af5738f8eef" ]; then
            echo "::error::Tesseract 5.5.3 is not the checked commit ($commit)."
            exit 1
          fi
          cmake -S "$src" -B "$src/build" -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 \
            -DCMAKE_PREFIX_PATH="$(brew --prefix leptonica)" \
            -DCMAKE_INSTALL_PREFIX="$out" -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TRAINING_TOOLS=OFF -DGRAPHICS_DISABLED=ON -DDISABLE_CURL=ON \
            -DDISABLE_ARCHIVE=ON -DDISABLE_TIFF=ON -DENABLE_NATIVE=OFF \
            -DENABLE_CCACHE=OFF -DOPENMP_BUILD=OFF -DINSTALL_CONFIGS=OFF
          cmake --build "$src/build"
          cmake --install "$src/build"
          cp "$src/LICENSE" "$out/LICENSE"
          echo "TESSERACT_BIN=$out/bin/tesseract" >> "$GITHUB_ENV"
          echo "TESSDATA_DIR=$(brew --prefix tesseract)/share/tessdata" >> "$GITHUB_ENV"

      - name: Check for the Mac signing certificate
        id: signing
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
        run: |
          if [ -n "$CERT_P12" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No MACOS_CERT_P12 secret: signing ad hoc (macOS will ask for Screen Recording after each update)."
          fi

      - name: Import the Mac signing certificate
        if: steps.signing.outputs.present == 'true'
        shell: bash
        env:
          CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          CERT_IDENTITY: ${{ secrets.MACOS_CERT_IDENTITY }}
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/signing.p12"' EXIT
          keychain="$RUNNER_TEMP/build-signing.keychain-db"
          security create-keychain -p actions "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p actions "$keychain"
          python - "$RUNNER_TEMP/signing.p12" <<'PY'
          import base64, os, sys
          with open(sys.argv[1], "wb") as f:
              f.write(base64.b64decode(os.environ["CERT_P12"]))
          PY
          security import "$RUNNER_TEMP/signing.p12" -k "$keychain" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$keychain"
          rm -f "$RUNNER_TEMP/signing.p12"
          identity="${CERT_IDENTITY:-$(security find-identity -p codesigning "$keychain" | awk -F'"' '/"/ {print $2; exit}')}"
          if [ -z "$identity" ]; then
            echo "::error::The certificate was imported but no code-signing identity was found. Set MACOS_CERT_IDENTITY to its name."
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          echo "Signing as: $identity"
          echo "MAC_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
          # Make sure the identity can actually sign before the build starts.
          cp /bin/echo "$RUNNER_TEMP/signing-test"
          codesign --force --sign "$identity" --keychain "$keychain" "$RUNNER_TEMP/signing-test"
          codesign --verify --strict "$RUNNER_TEMP/signing-test"

      - name: Build the Mac app
        run: python build.py

      - name: Check the app starts
        shell: bash
        run: |
          app="build/dist/Maple Classic Exp Overlay.app/Contents/MacOS/Maple Classic Exp Overlay"
          export MAPLE_EXP_DATA="$RUNNER_TEMP/overlay-data"
          mkdir -p "$MAPLE_EXP_DATA"
          "$app" & pid=$!
          sleep 20
          if ! kill -0 "$pid" 2>/dev/null; then
            echo "::error::The app closed by itself within 20 seconds."
            cat "$MAPLE_EXP_DATA/errors.log" 2>/dev/null
            exit 1
          fi
          kill "$pid"
          if [ -s "$MAPLE_EXP_DATA/errors.log" ]; then
            cat "$MAPLE_EXP_DATA/errors.log"
            echo "::error::The app wrote errors while starting."
            exit 1
          fi

      - name: Calculate SHA-256
        id: sum
        shell: bash
        run: |
          cd release
          shasum -a 256 *-mac.zip | tee SHA256SUMS.txt
          echo "zip=release/$(ls *-mac.zip)" >> "$GITHUB_OUTPUT"
          { echo "### The Mac download"; echo; echo '```'; cat SHA256SUMS.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest the download
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: ${{ steps.sum.outputs.zip }}

      - name: Verify the attestation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          for try in 1 2 3 4 5 6; do
            if gh attestation verify "$ZIP" --repo "$GITHUB_REPOSITORY" \
                 --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/build.yml"; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::The attestation doesn't verify."
          exit 1

      - name: Upload the Mac download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: ${{ steps.sum.outputs.zip }}
          archive: false

      - name: Upload the checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          path: release/SHA256SUMS.txt
          archive: false

      - name: Publish the Mac release
        if: steps.tag.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          ZIP: ${{ steps.sum.outputs.zip }}
        run: |
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null); then
            if [ "$existing" != "$GITHUB_SHA" ]; then
              echo "::error::$TAG is already on another commit. Raise VERSION in maple_exp.py."
              exit 1
            fi
          else
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" > /dev/null
          fi
          version=${TAG#v}
          name=$(basename "$ZIP")
          hash=$(shasum -a 256 "$ZIP" | cut -d' ' -f1)
          title="Maple Classic Exp Overlay $(echo "$TAG" | sed -E 's/-beta$/ (beta)/')"
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          notes=$(awk -v v="$version" '
            $0 == "## " v {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md | sed '/./,$!d')
          if [ -z "$notes" ]; then
            notes="See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/main/CHANGELOG.md) for what changed."
          fi
          {
            printf '%s\n\n' "$notes"
            echo '---'
            echo '**Check this download**'
            echo "- SHA-256 of $name: \`$hash\` (also in SHA256SUMS.txt)."
            echo "- Built by GitHub from this tag. Check it with: \`gh attestation verify $name --repo $GITHUB_REPOSITORY\`"
            echo "- The same file is on [the build's page]($run_url)."
          } > notes.md
          state=$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null || echo none)
          if [ "$state" = "none" ]; then
            gh release create "$TAG" "$ZIP" release/SHA256SUMS.txt --verify-tag --latest \
              --title "$title" --notes-file notes.md
          elif [ "$state" = "true" ]; then
            gh release upload "$TAG" "$ZIP" release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --draft=false --latest --title "$title" --notes-file notes.md
          else
            echo "::warning::$TAG is already published; the build is on this run's page."
            exit 0
          fi
          mkdir check
          gh release download "$TAG" --pattern "$name" --dir check
          (cd check && shasum -a 256 -c ../release/SHA256SUMS.txt)
